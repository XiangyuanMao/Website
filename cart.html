<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHU restaurant - Cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cart-page">

        <div class="cart-box">

            <h1>CART</h1>

            <div class="cart-left">

                <div class="cart-item">

                    <img src="assets/dish1.webp" alt="10 Course Vegan Degustation">

                    <div class="cart-info">
                        <h2>10 Course Vegan Degustation</h2>
                        <p>$95</p>
                    </div>

                    <div class="cart-quantity">
                        <button onclick="changeQty(0, 1)">+</button>
                        <span id="quantity0">0</span>
                        <button onclick="changeQty(0, -1)">−</button>
                    </div>

                </div>

            </div>

            <div class="cart-line"></div>

            <div class="cart-right">

                <div class="cart-total">
                    TOTAL: <span id="total">$ 0</span>
                </div>

                <button class="cart-action" onclick="window.location.href='OrderOnline.html'">
                    ADD MORE
                </button>

                <button class="cart-action">
                    PAY
                </button>

            </div>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
