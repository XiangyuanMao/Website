<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHU restaurant - Cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cart-page">

        <div class="cart-box">

            <h1>CART</h1>

            <div class="cart-left">

                <div id="cart-items"></div>

            </div>

            <div class="cart-line"></div>

            <div class="cart-right">

                <div class="cart-total">
                    TOTAL:
                    <span id="total">$ 0</span>
                </div>

                <button class="cart-action" onclick="window.location.href='OrderOnline.html'">
                    ADD MORE
                </button>

                <button class="cart-action" onclick="payNow()">
                    PAY
                </button>

            </div>

        </div>

    </div>


    <script src="script.js"></script>
</body>
</html>
